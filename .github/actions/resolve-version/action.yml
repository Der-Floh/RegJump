name: Resolve Version
description: Validates a release tag and reports the NuGet version it carries

inputs:
  tag:
    description: Release tag to read the version from (e.g. v1.2.3 or v2.0.0-beta.1)
    required: true

outputs:
  value:
    description: Version number without the leading v
    value: ${{ steps.version.outputs.value }}
  is-prerelease:
    description: Whether the version carries a SemVer prerelease label
    value: ${{ steps.version.outputs.is-prerelease }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        value="${TAG#v}"
        if [[ ! "$value" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::'$TAG' is not a version tag."
          exit 1
        fi
        if [[ "$value" == *-* ]]; then
          is_prerelease=true
        else
          is_prerelease=false
        fi
        echo "value=$value" >> "$GITHUB_OUTPUT"
        echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
        echo "Resolved $TAG to $value (prerelease: $is_prerelease)."
